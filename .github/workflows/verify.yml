# Local copy of repobuddy/.github's `pnpm-verify.yml`, minus the Playwright step.
#
# The shared workflow unconditionally runs the `setup-playwright` action, which
# shells out to `pnpm exec playwright --version` and exits 1 when Playwright is
# not installed. This package is a jest watch plugin with no browser tests, so
# the shared workflow can never go green here. Kept as a `workflow_call` file so
# the reported check names stay `code / verify (...)` and `code / all-checks`,
# matching the branch ruleset.
#
# Delete this file and go back to `repobuddy/.github/.github/workflows/pnpm-verify.yml@v2`
# once `setup-playwright` skips itself when Playwright is absent.
name: verify
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: '["ubuntu-latest"]'
      node-version:
        type: string
        required: false
        default: '["lts/-1", "lts/*"]'
      command:
        type: string
        required: false
        default: 'verify'

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}
        node-version: ${{ fromJson(inputs.node-version) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm ${{ inputs.command }}

  all-checks:
    needs: [verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.verify.result }}" != "success" ]]; then
            exit 1
          fi
